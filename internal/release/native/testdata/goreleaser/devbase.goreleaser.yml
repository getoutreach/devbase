# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
before:
  hooks:
    - make dep
builds:
  - main: ./cmd/devbase
    id: &name devbase
    binary: *name
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - '-w -s -X "github.com/getoutreach/gobox/pkg/app.Version=v{{ .Version }}"'
      - '-X "main.HoneycombTracingKey={{ .Env.HONEYCOMB_APIKEY }}"'
      - '-X "main.TeleforkAPIKey={{ .Env.TELEFORK_APIKEY }}"'
    env:
      - CGO_ENABLED=0
      ## <<Stencil::Block(devbaseAdditionalEnv)>>

      ## <</Stencil::Block>>

## <<Stencil::Block(archives)>>
archives:
  - files:
      - src: license*
      - src: LICENSE*
      - src: readme*
      - src: README*
      - src: release/yq
        dst: yq
        info:
          mode: 0755
      - src: release/tomlq
        dst: tomlq
        info:
          mode: 0755
## <</Stencil::Block>>
checksum:
  name_template: "checksums.txt"
release:
  # We handle releasing via semantic-release
  disable: true
