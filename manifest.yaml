name: github.com/getoutreach/devbase
arguments:
  disableDocGeneration:
    description: "Disables protobuf documentation generation."
    schema:
      type: boolean
  latestGoProtobufModules:
    description: "Use non-deprecated protobuf modules for Go"
    schema:
      type: boolean
  enableCgo:
    description: "Enables compiling Go binaries with cgo."
    schema:
      type: boolean
  go-protoc-imports:
    description: "Extra imports for protoc-generated Go code"
    schema:
      type: array
      items:
        type: object
        properties:
          module:
            type: string
          path:
            type: string
        required:
          - module
