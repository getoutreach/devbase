[workspace]
resolver = "2"
members = [
  "crates/gql_lint_cli",
  "crates/gql_lint_core",
  "crates/gql_lint_rules",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
apollo-compiler = "1"
apollo-parser = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
globset = "0.4"
gql_lint_core = { path = "crates/gql_lint_core" }
gql_lint_rules = { path = "crates/gql_lint_rules" }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
